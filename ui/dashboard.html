<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burp-Lite Dashboard</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --header-bg: #2d2d2d;
            --accent-color: #007acc;
            --border-color: #444;
            --panel-bg: #252525;
            --highlight: #363636;
            --success: #4caf50;
            --warning: #ff9800;
            --error: #f44336;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }
        
        header {
            grid-column: 1 / 3;
            background-color: var(--header-bg);
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-right: 20px;
        }
        
        .shield-icon {
            margin-right: 10px;
        }
        
        .traffic-list {
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 10px;
        }
        
        .traffic-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        
        .traffic-item:hover {
            background-color: var(--highlight);
        }
        
        .selected {
            background-color: var(--accent-color);
            color: white;
        }
        
        .detail-view {
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .tab.active {
            border-bottom: 2px solid var(--accent-color);
            color: var(--accent-color);
        }
        
        .tab-content {
            display: none;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 4px;
            overflow: auto;
            flex-grow: 1;
        }
        
        .tab-content.active {
            display: block;
            height: calc(100vh - 200px);
        }
        
        pre {
            margin: 0;
            white-space: pre-wrap;
        }
        
        .method {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .method-GET {
            background-color: #4caf50;
            color: white;
        }
        
        .method-POST {
            background-color: #ff9800;
            color: white;
        }
        
        .method-PUT {
            background-color: #2196F3;
            color: white;
        }
        
        .method-DELETE {
            background-color: #f44336;
            color: white;
        }
        
        .status-code {
            display: inline-block;
            width: 30px;
            text-align: center;
            padding: 3px;
            border-radius: 3px;
            margin-right: 5px;
        }
        
        .status-2xx {
            background-color: var(--success);
            color: white;
        }
        
        .status-3xx {
            background-color: var(--accent-color);
            color: white;
        }
        
        .status-4xx, .status-5xx {
            background-color: var(--error);
            color: white;
        }
        
        .header-name {
            color: var(--accent-color);
        }
        
        .no-data {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #777;
            font-style: italic;
        }
        
        .findings-panel {
            margin-top: 20px;
        }
        
        .finding {
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid;
            background-color: var(--panel-bg);
        }
        
        .finding.high {
            border-left-color: var(--error);
        }
        
        .finding.medium {
            border-left-color: var(--warning);
        }
        
        .finding.low {
            border-left-color: var(--accent-color);
        }
        
        .finding-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .finding-severity {
            float: right;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        
        .severity-high {
            background-color: var(--error);
            color: white;
        }
        
        .severity-medium {
            background-color: var(--warning);
            color: white;
        }
        
        .severity-low {
            background-color: var(--accent-color);
            color: white;
        }
        
        .load-button {
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        .load-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><span class="shield-icon">🛡️</span>Burp-Lite Dashboard</div>
        </header>
        
       <div class="traffic-list">
    <input id="searchBox" type="text" placeholder="Search traffic..." style="width: 100%; padding: 8px; margin-bottom: 10px;" />
    <button id="loadTraffic" class="load-button">Load Traffic</button>
    <div id="trafficItems">
        <div class="no-data">No traffic data loaded yet</div>
    </div>
</div>

        
        <div class="detail-view">
            <div id="detailHeader">
                <h2>HTTP Traffic Inspector</h2>
                <p>Select a request from the list to view details</p>
            </div>
            
            <div class="tabs">
                <div class="tab active" data-tab="request">Request</div>
                <div class="tab" data-tab="response">Response</div>
                <div class="tab" data-tab="findings">Security Findings</div>
            </div>
            
            <div id="requestView" class="tab-content active">
                <div class="no-data">Select a request to view details</div>
            </div>
            
            <div id="responseView" class="tab-content">
                <div class="no-data">Select a request to view response details</div>
            </div>
            
            <div id="findingsView" class="tab-content">
                <div class="no-data">Security findings will appear here</div>
            </div>
        </div>
    </div>
    
    <script>
        let trafficData = [];
        let selectedTraffic = null;
        
        document.getElementById('loadTraffic').addEventListener('click', loadTrafficData);
       document.getElementById('searchBox').addEventListener('input', updateTrafficList);
 
        // Tab switching logic
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and content
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                const tabContent = document.getElementById(tab.dataset.tab + 'View');
                tabContent.classList.add('active');
            });
        });

        function loadTrafficData() {
            // In a real application, this would fetch from the server
            // For demo, we'll use a fetch to access the traffic.json file
            fetch('/logs/traffic.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load traffic data');
                    }
                    return response.json();
                })
                .then(data => {
                    trafficData = data;
                    updateTrafficList();
                })
                .catch(error => {
                    console.error('Error loading traffic data:', error);
                    document.getElementById('trafficItems').innerHTML = 
                        `<div class="no-data">Error loading traffic data: ${error.message}</div>`;
                });
        }

        function updateTrafficList() {
    const trafficList = document.getElementById('trafficItems');
    const searchText = document.getElementById('searchBox').value.toLowerCase();

    if (!trafficData || trafficData.length === 0) {
        trafficList.innerHTML = '<div class="no-data">No traffic data available</div>';
        return;
    }

    trafficList.innerHTML = '';
    let matchFound = false;

    trafficData.forEach((item, index) => {
        const fullText = JSON.stringify(item).toLowerCase();
        if (!searchText || fullText.includes(searchText)) {
            matchFound = true;
            const trafficItem = document.createElement('div');
            trafficItem.className = 'traffic-item';
            trafficItem.dataset.index = index;

            const methodClass = `method-${item.method}`;
            const statusClass = `status-${Math.floor(item.response_code / 100)}xx`;

            trafficItem.innerHTML = `
                <span class="method ${methodClass}">${item.method}</span>
                <span class="status-code ${statusClass}">${item.response_code}</span>
                <span class="path">${item.path}</span>
            `;

            // Highlight suspicious content
            const bodyString = JSON.stringify(item.request_body || '').toLowerCase();
            if (bodyString.includes('password') || bodyString.includes('eyj')) {
                trafficItem.style.backgroundColor = '#4a1c1c'; // deep red
            }

            trafficItem.addEventListener('click', () => {
                selectTraffic(index);
            });

            trafficList.appendChild(trafficItem);
        }
    });

    if (!matchFound) {
        trafficList.innerHTML = '<div class="no-data">No matches found for your search.</div>';
    }
}


        function selectTraffic(index) {
            // Clear previous selection
            document.querySelectorAll('.traffic-item.selected').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Set new selection
            document.querySelector(`.traffic-item[data-index="${index}"]`).classList.add('selected');
            selectedTraffic = trafficData[index];
            
            // Update detail views
            updateRequestView();
            updateResponseView();
            updateFindingsView();
        }

        function updateRequestView() {
            const requestView = document.getElementById('requestView');
            if (!selectedTraffic) {
                requestView.innerHTML = '<div class="no-data">No request selected</div>';
                return;
            }
            
            let headersHTML = '';
            for (const [key, value] of Object.entries(selectedTraffic.request_headers)) {
                headersHTML += `<div><span class="header-name">${key}:</span> ${value}</div>`;
            }
            
            requestView.innerHTML = `
                <h3>${selectedTraffic.method} ${selectedTraffic.path}</h3>
                <h4>Headers:</h4>
                <div class="headers">${headersHTML}</div>
                <h4>Body:</h4>
                <pre>${formatBody(selectedTraffic.request_body)}</pre>
            `;
        }

        function updateResponseView() {
            const responseView = document.getElementById('responseView');
            if (!selectedTraffic) {
                responseView.innerHTML = '<div class="no-data">No response selected</div>';
                return;
            }
            
            let headersHTML = '';
            for (const [key, value] of Object.entries(selectedTraffic.response_headers || {})) {
                headersHTML += `<div><span class="header-name">${key}:</span> ${value}</div>`;
            }
            
            const statusClass = `status-${Math.floor(selectedTraffic.response_code/100)}xx`;
            
            responseView.innerHTML = `
                <h3>Response <span class="status-code ${statusClass}">${selectedTraffic.response_code}</span></h3>
                <h4>Headers:</h4>
                <div class="headers">${headersHTML}</div>
                <h4>Body:</h4>
                <pre>${formatBody(selectedTraffic.response_body)}</pre>
            `;
        }

        function updateFindingsView() {
            const findingsView = document.getElementById('findingsView');
            
            // This is a mock implementation - in a real app, findings would be fetched from the scanner
            // For demo purposes, we'll generate some sample findings based on the response headers
            if (!selectedTraffic || !selectedTraffic.response_headers) {
                findingsView.innerHTML = '<div class="no-data">No findings available</div>';
                return;
            }
            
            const findings = [];
            const headers = selectedTraffic.response_headers;
            const headersLowerCase = {};
            for (const key in headers) {
                headersLowerCase[key.toLowerCase()] = headers[key];
            }
            
            // Check for missing Content-Security-Policy
            if (!headersLowerCase['content-security-policy']) {
                findings.push({
                    severity: 'medium',
                    title: 'Missing Content-Security-Policy Header',
                    description: 'The Content-Security-Policy header is missing, which could make the site vulnerable to XSS attacks.',
                    remediation: 'Add a Content-Security-Policy header to responses.'
                });
            }
            
            // Check for missing X-Frame-Options
            if (!headersLowerCase['x-frame-options']) {
                findings.push({
                    severity: 'low',
                    title: 'Missing X-Frame-Options Header',
                    description: 'The X-Frame-Options header is missing, which could make the site vulnerable to clickjacking attacks.',
                    remediation: 'Add X-Frame-Options header with value DENY or SAMEORIGIN.'
                });
            }
            
            // If there are cookies, check for security flags
            if (headersLowerCase['set-cookie']) {
                const cookieHeader = headersLowerCase['set-cookie'];
                if (!cookieHeader.includes('httponly')) {
                    findings.push({
                        severity: 'medium',
                        title: 'Cookie Without HttpOnly Flag',
                        description: 'A cookie is set without the HttpOnly flag, which could make it accessible to client-side scripts.',
                        remediation: 'Add HttpOnly flag to cookies.'
                    });
                }
                if (!cookieHeader.includes('secure')) {
                    findings.push({
                        severity: 'medium',
                        title: 'Cookie Without Secure Flag',
                        description: 'A cookie is set without the Secure flag, which could allow it to be transmitted over unencrypted connections.',
                        remediation: 'Add Secure flag to cookies.'
                    });
                }
            }
            
            if (findings.length === 0) {
                findingsView.innerHTML = '<div class="findings-panel">No security issues found</div>';
                return;
            }
            
            let findingsHTML = '<div class="findings-panel">';
            findings.forEach(finding => {
                findingsHTML += `
                    <div class="finding ${finding.severity}">
                        <div class="finding-title">
                            ${finding.title}
                            <span class="finding-severity severity-${finding.severity}">${finding.severity}</span>
                        </div>
                        <p>${finding.description}</p>
                        <p><strong>Remediation:</strong> ${finding.remediation}</p>
                    </div>
                `;
            });
            findingsHTML += '</div>';
            
            findingsView.innerHTML = findingsHTML;
        }

        function formatBody(body) {
            if (!body) return '<em>(empty)</em>';
            
            // Try to parse as JSON for pretty-printing
            try {
                const json = JSON.parse(body);
                return JSON.stringify(json, null, 2);
            } catch (e) {
                // Not JSON, return as-is
                return body;
            }
        }
    </script>
</body>
</html>
